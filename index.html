
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StarZone - Celebrity Gallery</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#101014;color:white;
 font-family:Arial,sans-serif;
}
header{
 background:#1c1c25;padding:20px;
 text-align:center;border-bottom:2px solid #e83e79;
}
header h1{color:#ff4081;font-size:30px;margin:0}
header p{color:#bbb;margin-bottom:0}
nav{
 display:flex;justify-content:center;gap:20px;
 padding:14px;background:#242430;
 flex-wrap:wrap;
}
nav a{color:white;text-decoration:none}
nav a:hover{color:#ff4081}
.search{
 display:block;width:90%;max-width:600px;
 margin:22px auto;padding:14px;
 border:1px solid #444;border-radius:25px;
 background:#242430;color:white;font-size:16px;
}
h2{padding:0 15px;color:#ff4081}
.gallery{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:12px;padding:12px;
}
.card{background:#20202a;border-radius:10px;overflow:hidden}
.card img{
 width:100%;height:240px;object-fit:cover;
 display:block;cursor:zoom-in;
 transition:transform .3s;
}
.card img:hover{transform:scale(1.04)}
.card p{text-align:center;padding:8px;margin:0}
#viewer{
 display:none;position:fixed;inset:0;
 background:rgba(0,0,0,.96);z-index:10;
 align-items:center;justify-content:center;
 flex-direction:column;padding:15px;
}
#viewer img{
 max-width:100%;max-height:78vh;
 object-fit:contain;
}
.controls{display:flex;gap:25px;margin-top:15px}
button{
 background:#ff4081;color:white;border:0;
 border-radius:8px;padding:12px 18px;
 font-size:16px;cursor:pointer;
}
#close{position:absolute;right:18px;top:15px}
footer{text-align:center;padding:25px;color:#aaa}
@media(min-width:700px){
 .gallery{grid-template-columns:repeat(4,1fr)}
 .card img{height:300px}
}
</style>
</head>
<body>

<header>
<h1>⭐ STARZONE ⭐</h1>
<p>Celebrity Photo Gallery</p>
</header>

<nav>
<a href="#home">Home</a>
<a href="#actresses">Actresses</a>
<a href="#actors">Actors</a>
<a href="#latest">Latest Photos</a>
</nav>

<input class="search" id="search"
placeholder="Search celebrity albums..."
oninput="filterGallery()">

<h2 id="actresses">Actress Gallery</h2>

<div class="gallery" id="gallery">

<div class="card">
<img loading="lazy"
src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=1000"
alt="Actress Sample"
onclick="openPhoto(this)">
<p>Actress Sample 1</p>
</div>

<div class="card">
<img loading="lazy"
src="https://images.unsplash.com/photo-1531123897727-8f129e1688ce?w=1000"
alt="Actress Sample"
onclick="openPhoto(this)">
<p>Actress Sample 2</p>
</div>

<div class="card">
<img loading="lazy"
src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=1000"
alt="Actress Sample"
onclick="openPhoto(this)">
<p>Actress Sample 3</p>
</div>

<div class="card">
<img loading="lazy"
src="https://images.unsplash.com/photo-1529139574466-a303027c1d8b?w=1000"
alt="Actress Sample"
onclick="openPhoto(this)">
<p>Actress Sample 4</p>
</div>

</div>

<h2 id="actors">Actor Gallery</h2>
<div class="gallery">
<div class="card">
<img loading="lazy"
src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=1000"
alt="Actor Sample"
onclick="openPhoto(this)">
<p>Actor Sample 1</p>
</div>
<div class="card">
<img loading="lazy"
src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=1000"
alt="Actor Sample"
onclick="openPhoto(this)">
<p>Actor Sample 2</p>
</div>
</div>

<div id="viewer">
<button id="close" onclick="closePhoto()">✕</button>
<img id="large" alt="Enlarged photograph">
<div class="controls">
<button onclick="changePhoto(-1)">❮ Previous</button>
<button onclick="changePhoto(1)">Next ❯</button>
</div>
</div>

<footer>
<p>© 2026 StarZone Celebrity Gallery</p>
<p>Created with ❤️ by StarZone</p>
</footer>

<script>
let current=0;
let photos=[];

function refreshPhotos(){
 photos=[...document.querySelectorAll('.card img')]
 .filter(img=>img.closest('.card').style.display!=='none');
}

function openPhoto(img){
 refreshPhotos();
 current=photos.indexOf(img);
 showPhoto();
}

function showPhoto(){
 if(!photos.length)return;
 document.getElementById('large').src=photos[current].src;
 document.getElementById('viewer').style.display='flex';
}

function changePhoto(direction){
 current=(current+direction+photos.length)%photos.length;
 showPhoto();
}

function closePhoto(){
 document.getElementById('viewer').style.display='none';
}

function filterGallery(){
 let q=document.getElementById('search').value.toLowerCase();
 document.querySelectorAll('.card').forEach(card=>{
 card.style.display=card.innerText.toLowerCase().includes(q)
 ?'block':'none';
 });
}

document.addEventListener('keydown',e=>{
 if(e.key==='Escape')closePhoto();
 if(e.key==='ArrowRight')changePhoto(1);
 if(e.key==='ArrowLeft')changePhoto(-1);
});
</script>

</body>
</html>
