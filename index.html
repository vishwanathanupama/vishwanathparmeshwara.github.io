
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StarZone Celebrity Gallery</title>
<style>
body{margin:0;background:#101018;color:white;font-family:Arial}
header{text-align:center;background:#202033;padding:20px}
h1{color:#ff4081}
input{width:85%;padding:14px;margin:15px 5%;border:0;border-radius:25px}
.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:10px}
.gallery img{width:100%;height:220px;object-fit:cover;border-radius:12px}
#viewer{display:none;position:fixed;inset:0;background:#000e;justify-content:center;align-items:center}
#viewer img{max-width:95%;max-height:90%}
</style>
</head>
<body>
<header>
<h1>⭐ STARZONE ⭐</h1>
<p>Celebrity Photo Gallery</p>
</header>
<input id="search" placeholder="Search photos..." oninput="filterPhotos()">
<div class="gallery" id="gallery">
<img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=1000" alt="Gallery photo" onclick="zoom(this)">
<img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=1000" alt="Gallery photo" onclick="zoom(this)">
<img src="https://images.unsplash.com/photo-1531123897727-8f129e1688ce?w=1000" alt="Gallery photo" onclick="zoom(this)">
<img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=1000" alt="Gallery photo" onclick="zoom(this)">
</div>
<div id="viewer" onclick="this.style.display='none'">
<img id="large">
</div>
<script>
function zoom(img){
document.getElementById('large').src=img.src;
document.getElementById('viewer').style.display='flex';
}
function filterPhotos(){
let q=document.getElementById('search').value.toLowerCase();
document.querySelectorAll('.gallery img').forEach(img=>{
img.style.display=img.alt.toLowerCase().includes(q)?'block':'none';
});
}
</script>
</body>
</html>
